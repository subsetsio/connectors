# compiled by `hardened compile-checks` — post-publish audit of `office-of-rail-and-road-table-1311`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [row_label, source_column]
checks:
  - kind: unique
    columns: [row_label, source_column]
  - kind: not_null
    col: row_label
  - kind: not_null
    col: source_column
  - kind: row_floor
    min: 230
regression:
  # ORR revised this table from 1104 to 460 rows; keep the new stable floor while
  # allowing the baseline to advance after a clean run.
  row_shrink_tolerance: 0.6
  key_shrink_tolerance: 0.6
