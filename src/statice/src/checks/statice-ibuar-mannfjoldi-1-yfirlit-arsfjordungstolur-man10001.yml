# compiled by `hardened compile-checks` — post-publish audit of `statice-ibuar-mannfjoldi-1-yfirlit-arsfjordungstolur-man10001`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [municipality, obs_time, quarter, sex_and_citizenship]
temporal: source_updated
checks:
  - kind: unique
    columns: [municipality, obs_time, quarter, sex_and_citizenship]
  - kind: not_null
    col: municipality
  - kind: not_null
    col: obs_time
  - kind: not_null
    col: quarter
  - kind: not_null
    col: sex_and_citizenship
  - kind: row_floor
    min: 12090
regression:
  # PX-Web omits null observations; Statistics Iceland's MAN10001 sparsity
  # shifted from 24,180 to 20,640 populated cells in the 2026-07-31 run.
  row_shrink_tolerance: 0.15
  key_shrink_tolerance: 0.15
  temporal_monotonic: true
