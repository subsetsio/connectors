# compiled by `hardened compile-checks` — post-publish audit of `unctad-us.biotrademerchprodconcent`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [economy, economy_label, year, flow, flow_label]
temporal: year
checks:
  - kind: unique
    columns: [economy, economy_label, year, flow, flow_label]
  - kind: not_null
    col: economy
  - kind: not_null
    col: economy_label
  - kind: not_null
    col: year
  - kind: not_null
    col: flow
  - kind: not_null
    col: flow_label
  - kind: row_floor
    min: 3640
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
