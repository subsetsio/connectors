# compiled by `hardened compile-checks` — post-publish audit of `unctad-us.biotrademerchmarketindices`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [product, product_label, year, flow, flow_label]
temporal: year
checks:
  - kind: unique
    columns: [product, product_label, year, flow, flow_label]
  - kind: not_null
    col: product
  - kind: not_null
    col: product_label
  - kind: not_null
    col: year
  - kind: not_null
    col: flow
  - kind: not_null
    col: flow_label
  - kind: row_floor
    min: 33315
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
