# compiled by `hardened compile-checks` — post-publish audit of `unctad-us.govexpenditures`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [economy_label, economy, year, governmentexpenditure, governmentexpenditure_label]
temporal: year
checks:
  - kind: unique
    columns: [economy_label, economy, year, governmentexpenditure, governmentexpenditure_label]
  - kind: not_null
    col: economy_label
  - kind: not_null
    col: economy
  - kind: not_null
    col: year
  - kind: not_null
    col: governmentexpenditure
  - kind: not_null
    col: governmentexpenditure_label
  - kind: row_floor
    min: 12866
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
