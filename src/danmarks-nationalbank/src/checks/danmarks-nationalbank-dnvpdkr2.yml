# Hand-authored temporary audit for `danmarks-nationalbank-dnvpdkr2`.
# Re-run model-verify and `compile-checks --write` after the first complete
# raw extract so a measured row floor and verified grain can replace this.
temporal: time
checks:
  - kind: row_floor
    min: 1
regression:
  row_shrink_tolerance: 0.1
  temporal_monotonic: true
