# compiled by `hardened compile-checks` — post-publish audit of `philadelphia-fed-spf-dispersion`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [survey_date, variable, horizon, measure]
temporal: survey_date
checks:
  - kind: unique
    columns: [survey_date, variable, horizon, measure]
  - kind: not_null
    col: survey_date
  - kind: not_null
    col: variable
  - kind: not_null
    col: horizon
  - kind: not_null
    col: measure
  - kind: row_floor
    min: 19707
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
