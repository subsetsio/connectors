# compiled by `hardened compile-checks` — post-publish audit of `agmarknet-prices`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [state, district, market, commodity, variety, grade, arrival_date]
temporal: arrival_date
checks:
  - kind: unique
    columns: [state, district, market, commodity, variety, grade, arrival_date]
  - kind: not_null
    col: state
  - kind: not_null
    col: district
  - kind: not_null
    col: market
  - kind: not_null
    col: commodity
  - kind: not_null
    col: variety
  - kind: not_null
    col: grade
  - kind: not_null
    col: arrival_date
  - kind: row_floor
    min: 7522
regression:
  row_shrink_tolerance: 0.0
  key_shrink_tolerance: 0.0
  temporal_monotonic: true
