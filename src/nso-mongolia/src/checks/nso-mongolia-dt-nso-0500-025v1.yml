# compiled by `hardened compile-checks` — post-publish audit of `nso-mongolia-dt-nso-0500-025v1`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [quarter, component, statistical_indicator]
checks:
  - kind: unique
    columns: [quarter, component, statistical_indicator]
  - kind: not_null
    col: quarter
  - kind: not_null
    col: component
  - kind: not_null
    col: statistical_indicator
  - kind: row_floor
    min: 225
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
