# compiled by `hardened compile-checks` — post-publish audit of `norwegian-meteorological-institute-sunrise`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [date, solarnoon_time, solarmidnight_time, location]
temporal: date
checks:
  - kind: unique
    columns: [date, solarnoon_time, solarmidnight_time, location]
  - kind: not_null
    col: date
  - kind: not_null
    col: solarnoon_time
  - kind: not_null
    col: solarmidnight_time
  - kind: not_null
    col: location
  - kind: row_floor
    min: 125
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
