# compiled by `hardened compile-checks` — post-publish audit of `norwegian-meteorological-institute-spotwind`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [observation, valid_time, location, flight_level]
temporal: observation
checks:
  - kind: unique
    columns: [observation, valid_time, location, flight_level]
  - kind: not_null
    col: observation
  - kind: not_null
    col: valid_time
  - kind: not_null
    col: location
  - kind: not_null
    col: flight_level
  - kind: row_floor
    min: 600
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
