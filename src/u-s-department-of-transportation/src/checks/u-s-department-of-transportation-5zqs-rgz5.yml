# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-5zqs-rgz5`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [tmc, start_longitude, start_latitude, end_latitude, miles]
temporal: active_start_date
checks:
  - kind: unique
    columns: [tmc, start_longitude, start_latitude, end_latitude, miles]
  - kind: not_null
    col: tmc
  - kind: not_null
    col: start_longitude
  - kind: not_null
    col: start_latitude
  - kind: not_null
    col: end_latitude
  - kind: not_null
    col: miles
  - kind: row_floor
    min: 37
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
