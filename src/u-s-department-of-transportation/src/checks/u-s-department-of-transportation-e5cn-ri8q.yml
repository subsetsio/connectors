# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-e5cn-ri8q`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [id, state, abbrev, fips, effective_date]
temporal: effective_date
checks:
  - kind: unique
    columns: [id, state, abbrev, fips, effective_date]
  - kind: not_null
    col: id
  - kind: not_null
    col: state
  - kind: not_null
    col: abbrev
  - kind: not_null
    col: fips
  - kind: not_null
    col: effective_date
  - kind: row_floor
    min: 684
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
