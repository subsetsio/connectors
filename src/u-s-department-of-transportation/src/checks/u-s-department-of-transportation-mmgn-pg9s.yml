# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-mmgn-pg9s`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [census_tract_name, county, state, census_tract_meets_definition, county_meets_definition]
checks:
  - kind: unique
    columns: [census_tract_name, county, state, census_tract_meets_definition, county_meets_definition]
  - kind: not_null
    col: census_tract_name
  - kind: not_null
    col: county
  - kind: not_null
    col: state
  - kind: not_null
    col: census_tract_meets_definition
  - kind: not_null
    col: county_meets_definition
  - kind: row_floor
    min: 36528
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
