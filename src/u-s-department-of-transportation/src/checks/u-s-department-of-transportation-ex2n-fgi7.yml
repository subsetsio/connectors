# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-ex2n-fgi7`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [percent_of_commuters, msa, year, msa_size]
temporal: year
checks:
  - kind: unique
    columns: [percent_of_commuters, msa, year, msa_size]
  - kind: not_null
    col: percent_of_commuters
  - kind: not_null
    col: msa
  - kind: not_null
    col: year
  - kind: not_null
    col: msa_size
  - kind: row_floor
    min: 222
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
