# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-h9wa-fbqt`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [year, item, group, recipient, category]
temporal: year
checks:
  - kind: unique
    columns: [year, item, group, recipient, category]
  - kind: not_null
    col: year
  - kind: not_null
    col: item
  - kind: not_null
    col: group
  - kind: not_null
    col: recipient
  - kind: not_null
    col: category
  - kind: row_floor
    min: 1253
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
