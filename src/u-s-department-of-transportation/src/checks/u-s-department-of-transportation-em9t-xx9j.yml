# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-em9t-xx9j`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [full_time_employees, total_employees, part_time_employees, year]
temporal: year
checks:
  - kind: unique
    columns: [full_time_employees, total_employees, part_time_employees, year]
  - kind: not_null
    col: full_time_employees
  - kind: not_null
    col: total_employees
  - kind: not_null
    col: part_time_employees
  - kind: not_null
    col: year
  - kind: row_floor
    min: 400
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
