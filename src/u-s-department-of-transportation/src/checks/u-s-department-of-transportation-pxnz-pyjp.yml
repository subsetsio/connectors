# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-pxnz-pyjp`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [sample_id, fut_aadt, begin_lrs, end_lrs, lrs_id]
checks:
  - kind: unique
    columns: [sample_id, fut_aadt, begin_lrs, end_lrs, lrs_id]
  - kind: not_null
    col: sample_id
  - kind: not_null
    col: fut_aadt
  - kind: not_null
    col: begin_lrs
  - kind: not_null
    col: end_lrs
  - kind: not_null
    col: lrs_id
  - kind: row_floor
    min: 55557
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
