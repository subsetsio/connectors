# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-psyb-ymuy`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [msg_id, tmstp_utc, msg_milliseconds_utc, msg_moy_utc, inbound_lane]
temporal: tmstp_utc
checks:
  - kind: unique
    columns: [msg_id, tmstp_utc, msg_milliseconds_utc, msg_moy_utc, inbound_lane]
  - kind: not_null
    col: msg_id
  - kind: not_null
    col: tmstp_utc
  - kind: not_null
    col: msg_milliseconds_utc
  - kind: not_null
    col: msg_moy_utc
  - kind: not_null
    col: inbound_lane
  - kind: row_floor
    min: 43128
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
