# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-vudg-jaa5`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [longitude, terminal_id, terminal_name, operator_id, term_state]
checks:
  - kind: unique
    columns: [longitude, terminal_id, terminal_name, operator_id, term_state]
  - kind: not_null
    col: longitude
  - kind: not_null
    col: terminal_id
  - kind: not_null
    col: terminal_name
  - kind: not_null
    col: operator_id
  - kind: not_null
    col: term_state
  - kind: row_floor
    min: 342
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
