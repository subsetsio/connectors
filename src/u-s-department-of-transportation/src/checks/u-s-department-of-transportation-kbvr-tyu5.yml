# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-kbvr-tyu5`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [value, id, date, state, fips]
temporal: date
checks:
  - kind: unique
    columns: [value, id, date, state, fips]
  - kind: not_null
    col: value
  - kind: not_null
    col: id
  - kind: not_null
    col: date
  - kind: not_null
    col: state
  - kind: not_null
    col: fips
  - kind: row_floor
    min: 8978
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
