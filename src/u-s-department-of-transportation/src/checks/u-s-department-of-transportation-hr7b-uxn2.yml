# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-hr7b-uxn2`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [state, year, disposition, type, gov_level]
temporal: year
checks:
  - kind: unique
    columns: [state, year, disposition, type, gov_level]
  - kind: not_null
    col: state
  - kind: not_null
    col: year
  - kind: not_null
    col: disposition
  - kind: not_null
    col: type
  - kind: not_null
    col: gov_level
  - kind: row_floor
    min: 6625
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
