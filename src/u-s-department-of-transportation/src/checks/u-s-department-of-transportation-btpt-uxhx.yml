# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-btpt-uxhx`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [date, week_num, indicator, mode]
temporal: date
checks:
  - kind: unique
    columns: [date, week_num, indicator, mode]
  - kind: not_null
    col: date
  - kind: not_null
    col: week_num
  - kind: not_null
    col: indicator
  - kind: not_null
    col: mode
  - kind: row_floor
    min: 1614
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
