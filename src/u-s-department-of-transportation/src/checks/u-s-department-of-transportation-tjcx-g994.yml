# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-tjcx-g994`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [expenditures, state, year, improvement_type, funding_area]
temporal: year
checks:
  - kind: unique
    columns: [expenditures, state, year, improvement_type, funding_area]
  - kind: not_null
    col: expenditures
  - kind: not_null
    col: state
  - kind: not_null
    col: year
  - kind: not_null
    col: improvement_type
  - kind: not_null
    col: funding_area
  - kind: row_floor
    min: 8750
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
