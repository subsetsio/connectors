# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-ge9b-nbt9`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [core_details, line, start_date, end_date, ending_cross_street]
temporal: end_date
checks:
  - kind: unique
    columns: [core_details, line, start_date, end_date, ending_cross_street]
  - kind: not_null
    col: core_details
  - kind: not_null
    col: line
  - kind: not_null
    col: start_date
  - kind: not_null
    col: end_date
  - kind: not_null
    col: ending_cross_street
  - kind: row_floor
    min: 1186
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
