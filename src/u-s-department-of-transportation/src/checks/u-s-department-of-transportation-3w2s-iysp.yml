# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-3w2s-iysp`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [date, combined_tsi, passenger_tsi, freight_tsi]
temporal: date
checks:
  - kind: unique
    columns: [date, combined_tsi, passenger_tsi, freight_tsi]
  - kind: not_null
    col: date
  - kind: not_null
    col: combined_tsi
  - kind: not_null
    col: passenger_tsi
  - kind: not_null
    col: freight_tsi
  - kind: row_floor
    min: 146
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
