# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-h2kz-rw8a`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [id, date, year, measure, metric]
temporal: date
checks:
  - kind: unique
    columns: [id, date, year, measure, metric]
  - kind: not_null
    col: id
  - kind: not_null
    col: date
  - kind: not_null
    col: year
  - kind: not_null
    col: measure
  - kind: not_null
    col: metric
  - kind: row_floor
    min: 196
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
