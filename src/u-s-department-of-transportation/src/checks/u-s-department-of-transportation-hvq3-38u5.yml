# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-hvq3-38u5`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [date, week_number, indicator, year]
temporal: date
checks:
  - kind: unique
    columns: [date, week_number, indicator, year]
  - kind: not_null
    col: date
  - kind: not_null
    col: week_number
  - kind: not_null
    col: indicator
  - kind: not_null
    col: year
  - kind: row_floor
    min: 2057
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
