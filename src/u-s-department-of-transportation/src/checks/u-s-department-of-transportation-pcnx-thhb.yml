# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-pcnx-thhb`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [measurement_start, speed, volume, occupancy, lane_id]
temporal: measurement_start
checks:
  - kind: unique
    columns: [measurement_start, speed, volume, occupancy, lane_id]
  - kind: not_null
    col: measurement_start
  - kind: not_null
    col: speed
  - kind: not_null
    col: volume
  - kind: not_null
    col: occupancy
  - kind: not_null
    col: lane_id
  - kind: row_floor
    min: 447991
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
