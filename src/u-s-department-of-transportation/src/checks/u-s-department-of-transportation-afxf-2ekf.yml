# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-afxf-2ekf`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [miles, state, year, extent, system]
temporal: year
checks:
  - kind: unique
    columns: [miles, state, year, extent, system]
  - kind: not_null
    col: miles
  - kind: not_null
    col: state
  - kind: not_null
    col: year
  - kind: not_null
    col: extent
  - kind: not_null
    col: system
  - kind: row_floor
    min: 4992
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
