# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-8fhs-nes8`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [receipts, state, year, tax, account]
temporal: year
checks:
  - kind: unique
    columns: [receipts, state, year, tax, account]
  - kind: not_null
    col: receipts
  - kind: not_null
    col: state
  - kind: not_null
    col: year
  - kind: not_null
    col: tax
  - kind: not_null
    col: account
  - kind: row_floor
    min: 4998
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
