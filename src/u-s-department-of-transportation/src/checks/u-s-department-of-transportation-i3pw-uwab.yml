# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-i3pw-uwab`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [ntd_id, reporter_name, states_served, service_type_code, reportertypeshort]
checks:
  - kind: unique
    columns: [ntd_id, reporter_name, states_served, service_type_code, reportertypeshort]
  - kind: not_null
    col: ntd_id
  - kind: not_null
    col: reporter_name
  - kind: not_null
    col: states_served
  - kind: not_null
    col: service_type_code
  - kind: not_null
    col: reportertypeshort
  - kind: row_floor
    min: 1030
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
