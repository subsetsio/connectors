# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-tchw-zxud`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [week_ending, week_number, mode, indicator]
temporal: week_ending
checks:
  - kind: unique
    columns: [week_ending, week_number, mode, indicator]
  - kind: not_null
    col: week_ending
  - kind: not_null
    col: week_number
  - kind: not_null
    col: mode
  - kind: not_null
    col: indicator
  - kind: row_floor
    min: 311
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
