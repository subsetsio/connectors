# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-mt5m-skz3`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [non_divisible_trip_permits, state, year]
temporal: year
checks:
  - kind: unique
    columns: [non_divisible_trip_permits, state, year]
  - kind: not_null
    col: non_divisible_trip_permits
  - kind: not_null
    col: state
  - kind: not_null
    col: year
  - kind: row_floor
    min: 155
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
