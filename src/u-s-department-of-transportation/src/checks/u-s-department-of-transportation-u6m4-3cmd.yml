# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-u6m4-3cmd`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [vessel_name, uscg_number, vessel_id, registered_length, passenger_capacity]
checks:
  - kind: unique
    columns: [vessel_name, uscg_number, vessel_id, registered_length, passenger_capacity]
  - kind: not_null
    col: vessel_name
  - kind: not_null
    col: uscg_number
  - kind: not_null
    col: vessel_id
  - kind: not_null
    col: registered_length
  - kind: not_null
    col: passenger_capacity
  - kind: row_floor
    min: 361
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
