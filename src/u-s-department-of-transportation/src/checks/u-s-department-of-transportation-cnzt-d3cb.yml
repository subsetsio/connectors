# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-cnzt-d3cb`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [ridership, station, year, state]
temporal: year
checks:
  - kind: unique
    columns: [ridership, station, year, state]
  - kind: not_null
    col: ridership
  - kind: not_null
    col: station
  - kind: not_null
    col: year
  - kind: not_null
    col: state
  - kind: row_floor
    min: 237
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
