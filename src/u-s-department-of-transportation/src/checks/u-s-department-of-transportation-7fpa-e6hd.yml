# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-7fpa-e6hd`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [sample_id, begin_point, end_point, expansion_length, route_id]
checks:
  - kind: unique
    columns: [sample_id, begin_point, end_point, expansion_length, route_id]
  - kind: not_null
    col: sample_id
  - kind: not_null
    col: begin_point
  - kind: not_null
    col: end_point
  - kind: not_null
    col: expansion_length
  - kind: not_null
    col: route_id
  - kind: row_floor
    min: 99880
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
