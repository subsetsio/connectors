# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-wqw2-rjgd`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [unique_id, cur_fare, cur_yield, city, citymarketid]
temporal: year
checks:
  - kind: unique
    columns: [unique_id, cur_fare, cur_yield, city, citymarketid]
  - kind: not_null
    col: unique_id
  - kind: not_null
    col: cur_fare
  - kind: not_null
    col: cur_yield
  - kind: not_null
    col: city
  - kind: not_null
    col: citymarketid
  - kind: row_floor
    min: 4333
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
