# compiled by `hardened compile-checks` — post-publish audit of `u-s-department-of-transportation-wmvq-by24`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [terminal_id, longitude, terminal_name, latitude, term_city]
checks:
  - kind: unique
    columns: [terminal_id, longitude, terminal_name, latitude, term_city]
  - kind: not_null
    col: terminal_id
  - kind: not_null
    col: longitude
  - kind: not_null
    col: terminal_name
  - kind: not_null
    col: latitude
  - kind: not_null
    col: term_city
  - kind: row_floor
    min: 287
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
