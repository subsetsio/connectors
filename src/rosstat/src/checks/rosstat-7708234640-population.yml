# compiled by `hardened compile-checks` — post-publish audit of `rosstat-7708234640-population`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [kode, number, total, rural, urban]
temporal: year
checks:
  - kind: unique
    columns: [kode, number, total, rural, urban]
  - kind: not_null
    col: kode
  - kind: not_null
    col: number
  - kind: not_null
    col: total
  - kind: not_null
    col: rural
  - kind: not_null
    col: urban
  - kind: row_floor
    min: 12794
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
