spec_id: destatis-53211
tests:
- not_null: statistic_code
- not_null: table_code
- not_null: measure_code
- matches:
    col: statistic_code
    pattern: '53211'
  reason: every cell in this asset belongs to statistic 53211; a foreign code means the spec id was mis-parsed and the wrong statistic was fetched into this asset
  certainty: 99
- column_type:
    col: value
    type: float
- column_type:
    col: year
    type: integer
- column_type:
    col: dims
    type: string
  reason: classifying dimensions are serialized to a JSON string, never fanned into typed columns, because they drift across a statistic's tables
  certainty: 95
- row_count:
    min: 1
  reason: a statistic listed by /statistics with at least one table must yield cells; zero rows means every one of its tables 404'd or the endpoint changed shape
  certainty: 90
- between:
    col: year
    lo: 1900
    hi: 2100
  reason: GENESIS periods span modern German official statistics; the upper bound is loose on purpose because population and household projections run decades ahead
  certainty: 95
- freshness:
    col: year
    reaches: 1900
  reason: generic temporal-coverage declaration for GENESIS statistics. Individual EVAS statistics may be current, discontinued, or historical; row_count and type checks guard shape while model freshness records the observed latest year.
  certainty: 65
  points_outward: true
