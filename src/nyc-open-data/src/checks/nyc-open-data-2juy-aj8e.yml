# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-2juy-aj8e`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [startofperiod, endofperiod, latitudelongitude, datasourceid]
temporal: startofperiod
checks:
  - kind: unique
    columns: [startofperiod, endofperiod, latitudelongitude, datasourceid]
  - kind: not_null
    col: startofperiod
  - kind: not_null
    col: endofperiod
  - kind: not_null
    col: latitudelongitude
  - kind: not_null
    col: datasourceid
  - kind: row_floor
    min: 33803
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
