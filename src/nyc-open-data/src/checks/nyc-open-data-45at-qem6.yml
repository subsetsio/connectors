# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-45at-qem6`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [the_geom, air_lot_number, last_edited_date, last_edited_user, model]
checks:
  - kind: unique
    columns: [the_geom, air_lot_number, last_edited_date, last_edited_user, model]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: air_lot_number
  - kind: not_null
    col: last_edited_date
  - kind: not_null
    col: last_edited_user
  - kind: not_null
    col: model
  - kind: row_floor
    min: 58
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
