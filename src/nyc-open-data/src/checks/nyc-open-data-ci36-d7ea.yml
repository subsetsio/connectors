# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-ci36-d7ea`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dbn, dates_of_review, survey_pp_se, survey_pp_es, survey_pp_ct]
checks:
  - kind: unique
    columns: [dbn, dates_of_review, survey_pp_se, survey_pp_es, survey_pp_ct]
  - kind: not_null
    col: dbn
  - kind: not_null
    col: dates_of_review
  - kind: not_null
    col: survey_pp_se
  - kind: not_null
    col: survey_pp_es
  - kind: not_null
    col: survey_pp_ct
  - kind: row_floor
    min: 242
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
