# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-mpqk-skis`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [report_start_date, number, report_end_date, facility]
temporal: report_start_date
checks:
  - kind: unique
    columns: [report_start_date, number, report_end_date, facility]
  - kind: not_null
    col: report_start_date
  - kind: not_null
    col: number
  - kind: not_null
    col: report_end_date
  - kind: not_null
    col: facility
  - kind: row_floor
    min: 58
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
