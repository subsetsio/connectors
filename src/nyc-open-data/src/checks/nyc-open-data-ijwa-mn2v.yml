# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-ijwa-mn2v`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [system, multipolygon, gispropnum, name, borough]
checks:
  - kind: unique
    columns: [system, multipolygon, gispropnum, name, borough]
  - kind: not_null
    col: system
  - kind: not_null
    col: multipolygon
  - kind: not_null
    col: gispropnum
  - kind: not_null
    col: name
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 98
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
