# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-xffd-vsgf`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [school, gradelevel, month_code, calmonth]
checks:
  - kind: unique
    columns: [school, gradelevel, month_code, calmonth]
  - kind: not_null
    col: school
  - kind: not_null
    col: gradelevel
  - kind: not_null
    col: month_code
  - kind: not_null
    col: calmonth
  - kind: row_floor
    min: 46188
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
