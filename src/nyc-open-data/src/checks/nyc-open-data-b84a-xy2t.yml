    columns: [date_of_inspection, time_of_visitation_hhmmss, zip_code, location_id, borough]
  - kind: not_null
    col: date_of_inspection
  - kind: not_null
    col: time_of_visitation_hhmmss
  - kind: not_null
    col: zip_code
  - kind: not_null
    col: location_id
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 27
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
