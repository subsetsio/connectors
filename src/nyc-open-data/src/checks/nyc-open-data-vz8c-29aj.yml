# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-vz8c-29aj`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [phone, address, location_1, borough]
checks:
  - kind: unique
    columns: [phone, address, location_1, borough]
  - kind: not_null
    col: phone
  - kind: not_null
    col: address
  - kind: not_null
    col: location_1
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 6
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
