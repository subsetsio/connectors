# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-j34j-vqvt`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [averageresponsetime, yearmonth, incidentclassification, incidentborough]
temporal: averageresponsetime
checks:
  - kind: unique
    columns: [averageresponsetime, yearmonth, incidentclassification, incidentborough]
  - kind: not_null
    col: averageresponsetime
  - kind: not_null
    col: yearmonth
  - kind: not_null
    col: incidentclassification
  - kind: not_null
    col: incidentborough
  - kind: row_floor
    min: 3276
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
