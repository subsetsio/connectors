# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-kbai-jcya`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: ["2023_category", "2005_category", "2013_category", "2017_category", comparative_category]
checks:
  - kind: unique
    columns: ["2023_category", "2005_category", "2013_category", "2017_category", comparative_category]
  - kind: not_null
    col: "2023_category"
  - kind: not_null
    col: "2005_category"
  - kind: not_null
    col: "2013_category"
  - kind: not_null
    col: "2017_category"
  - kind: not_null
    col: comparative_category
  - kind: row_floor
    min: 60
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
