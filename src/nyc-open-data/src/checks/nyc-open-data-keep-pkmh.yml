# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-keep-pkmh`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [tax_id, complaint_id, ccrb_substantiated_officer_disposition]
temporal: as_of_date
checks:
  - kind: unique
    columns: [tax_id, complaint_id, ccrb_substantiated_officer_disposition]
  - kind: not_null
    col: tax_id
  - kind: not_null
    col: complaint_id
  - kind: not_null
    col: ccrb_substantiated_officer_disposition
  - kind: row_floor
    min: 7534
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
