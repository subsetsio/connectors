# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-xsj8-452q`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [year, borough, calendar_or_fiscal_year]
checks:
  - kind: unique
    columns: [year, borough, calendar_or_fiscal_year]
  - kind: not_null
    col: year
  - kind: not_null
    col: borough
  - kind: not_null
    col: calendar_or_fiscal_year
  - kind: row_floor
    min: 100
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
