# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-3ub5-4ph8`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [address, house, street, stairhall, development]
checks:
  - kind: unique
    columns: [address, house, street, stairhall, development]
  - kind: not_null
    col: address
  - kind: not_null
    col: house
  - kind: not_null
    col: street
  - kind: not_null
    col: stairhall
  - kind: not_null
    col: development
  - kind: row_floor
    min: 1477
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
