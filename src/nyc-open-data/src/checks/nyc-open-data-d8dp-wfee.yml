    columns: [tostreet, the_geom, onstreet, fromstreet, yr]
  - kind: not_null
    col: tostreet
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: onstreet
  - kind: not_null
    col: fromstreet
  - kind: not_null
    col: yr
  - kind: row_floor
    min: 222
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
