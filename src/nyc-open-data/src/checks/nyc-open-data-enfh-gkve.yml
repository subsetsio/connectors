# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-enfh-gkve`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [globalid, location, councildistrict, department, parentid]
temporal: acquisitiondate
checks:
  - kind: unique
    columns: [globalid, location, councildistrict, department, parentid]
  - kind: not_null
    col: globalid
  - kind: not_null
    col: location
  - kind: not_null
    col: councildistrict
  - kind: not_null
    col: department
  - kind: not_null
    col: parentid
  - kind: row_floor
    min: 1029
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
