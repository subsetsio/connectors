# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-tfrc-rjtr`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [date, project_id, title, public_private, action]
temporal: date
checks:
  - kind: unique
    columns: [date, project_id, title, public_private, action]
  - kind: not_null
    col: date
  - kind: not_null
    col: project_id
  - kind: not_null
    col: title
  - kind: not_null
    col: public_private
  - kind: not_null
    col: action
  - kind: row_floor
    min: 1597
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
