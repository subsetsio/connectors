# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-gcnt-k7eq`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [number_of_applicants, metric, demographic_subtype, report_type, demographic_type]
temporal: date
checks:
  - kind: unique
    columns: [number_of_applicants, metric, demographic_subtype, report_type, demographic_type]
  - kind: not_null
    col: number_of_applicants
  - kind: not_null
    col: metric
  - kind: not_null
    col: demographic_subtype
  - kind: not_null
    col: report_type
  - kind: not_null
    col: demographic_type
  - kind: row_floor
    min: 67
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
