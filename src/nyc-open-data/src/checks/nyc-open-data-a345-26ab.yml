    columns: [ela_level_3, math_level_3, ela_level_2, math_level_4, asian]
  - kind: not_null
    col: ela_level_3
  - kind: not_null
    col: math_level_3
  - kind: not_null
    col: ela_level_2
  - kind: not_null
    col: math_level_4
  - kind: not_null
    col: asian
  - kind: row_floor
    min: 96
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
