# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-7igh-afai`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [the_geom, ct2000, ntaname, ntacode, boroname]
checks:
  - kind: unique
    columns: [the_geom, ct2000, ntaname, ntacode, boroname]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: ct2000
  - kind: not_null
    col: ntaname
  - kind: not_null
    col: ntacode
  - kind: not_null
    col: boroname
  - kind: row_floor
    min: 1108
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
