# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-56u5-n9sa`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [building_name, building_address, borough_number, borough]
checks:
  - kind: unique
    columns: [building_name, building_address, borough_number, borough]
  - kind: not_null
    col: building_name
  - kind: not_null
    col: building_address
  - kind: not_null
    col: borough_number
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 27
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
