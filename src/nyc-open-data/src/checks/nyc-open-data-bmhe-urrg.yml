# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-bmhe-urrg`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dbn, nonell_principal, nonell_removals, nonell_superintendent, ell_principal]
checks:
  - kind: unique
    columns: [dbn, nonell_principal, nonell_removals, nonell_superintendent, ell_principal]
  - kind: not_null
    col: dbn
  - kind: not_null
    col: nonell_principal
  - kind: not_null
    col: nonell_removals
  - kind: not_null
    col: nonell_superintendent
  - kind: not_null
    col: ell_principal
  - kind: row_floor
    min: 871
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
