# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-9igb-ny64`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [subject, program_type, department, grade_level]
checks:
  - kind: unique
    columns: [subject, program_type, department, grade_level]
  - kind: not_null
    col: subject
  - kind: not_null
    col: program_type
  - kind: not_null
    col: department
  - kind: not_null
    col: grade_level
  - kind: row_floor
    min: 50
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
