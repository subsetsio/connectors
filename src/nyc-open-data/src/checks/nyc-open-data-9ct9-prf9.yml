# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-9ct9-prf9`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [school_name, dbn, num_of_ap_total_exams_taken, num_of_ap_test_takers, num_of_ap_exams_passed]
checks:
  - kind: unique
    columns: [school_name, dbn, num_of_ap_total_exams_taken, num_of_ap_test_takers, num_of_ap_exams_passed]
  - kind: not_null
    col: school_name
  - kind: not_null
    col: dbn
  - kind: not_null
    col: num_of_ap_total_exams_taken
  - kind: not_null
    col: num_of_ap_test_takers
  - kind: not_null
    col: num_of_ap_exams_passed
  - kind: row_floor
    min: 239
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
