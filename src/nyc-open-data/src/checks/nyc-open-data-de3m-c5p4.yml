# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-de3m-c5p4`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [the_geom, location, ntaname, borocd, boroname]
temporal: date_insta
checks:
  - kind: unique
    columns: [the_geom, location, ntaname, borocd, boroname]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: location
  - kind: not_null
    col: ntaname
  - kind: not_null
    col: borocd
  - kind: not_null
    col: boroname
  - kind: row_floor
    min: 2103
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
