# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-suzc-ps6g`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [site_id, site_name, site_type, year]
checks:
  - kind: unique
    columns: [site_id, site_name, site_type, year]
  - kind: not_null
    col: site_id
  - kind: not_null
    col: site_name
  - kind: not_null
    col: site_type
  - kind: not_null
    col: year
  - kind: row_floor
    min: 74
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
