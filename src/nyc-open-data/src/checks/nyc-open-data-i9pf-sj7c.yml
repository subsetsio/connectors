# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-i9pf-sj7c`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [program, dbn, "10ap", "10seats", interest]
checks:
  - kind: unique
    columns: [program, dbn, "10ap", "10seats", interest]
  - kind: not_null
    col: program
  - kind: not_null
    col: dbn
  - kind: not_null
    col: "10ap"
  - kind: not_null
    col: "10seats"
  - kind: not_null
    col: interest
  - kind: row_floor
    min: 359
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
