# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-ge8j-uqbf`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [code, program, dbn, interest, method]
checks:
  - kind: unique
    columns: [code, program, dbn, interest, method]
  - kind: not_null
    col: code
  - kind: not_null
    col: program
  - kind: not_null
    col: dbn
  - kind: not_null
    col: interest
  - kind: not_null
    col: method
  - kind: row_floor
    min: 384
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
