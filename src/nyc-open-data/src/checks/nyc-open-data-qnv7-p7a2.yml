# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-qnv7-p7a2`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [point, system, district, omppropid, propname]
checks:
  - kind: unique
    columns: [point, system, district, omppropid, propname]
  - kind: not_null
    col: point
  - kind: not_null
    col: system
  - kind: not_null
    col: district
  - kind: not_null
    col: omppropid
  - kind: not_null
    col: propname
  - kind: row_floor
    min: 1924
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
