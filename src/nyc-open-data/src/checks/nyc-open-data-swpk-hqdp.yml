# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-swpk-hqdp`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [nta_name, nta_code, fips_county_code, borough, year]
checks:
  - kind: unique
    columns: [nta_name, nta_code, fips_county_code, borough, year]
  - kind: not_null
    col: nta_name
  - kind: not_null
    col: nta_code
  - kind: not_null
    col: fips_county_code
  - kind: not_null
    col: borough
  - kind: not_null
    col: year
  - kind: row_floor
    min: 195
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
