# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-ewg2-2vyd`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dbn, black_principal, hispanic_principal, black_removals, hispanic_removals]
checks:
  - kind: unique
    columns: [dbn, black_principal, hispanic_principal, black_removals, hispanic_removals]
  - kind: not_null
    col: dbn
  - kind: not_null
    col: black_principal
  - kind: not_null
    col: hispanic_principal
  - kind: not_null
    col: black_removals
  - kind: not_null
    col: hispanic_removals
  - kind: row_floor
    min: 871
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
