# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-weg5-33pj`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [overall_score, dbn, peer_index, performance_category_score, environment_category_score]
checks:
  - kind: unique
    columns: [overall_score, dbn, peer_index, performance_category_score, environment_category_score]
  - kind: not_null
    col: overall_score
  - kind: not_null
    col: dbn
  - kind: not_null
    col: peer_index
  - kind: not_null
    col: performance_category_score
  - kind: not_null
    col: environment_category_score
  - kind: row_floor
    min: 631
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
