# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-b7aj-ck5a`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [source, source_category, main_sector, units]
checks:
  - kind: unique
    columns: [source, source_category, main_sector, units]
  - kind: not_null
    col: source
  - kind: not_null
    col: source_category
  - kind: not_null
    col: main_sector
  - kind: not_null
    col: units
  - kind: row_floor
    min: 21
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
