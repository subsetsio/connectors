# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-nnf6-km2a`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [project_title, institution, park_name, taxa_or_area_of_study, borough]
checks:
  - kind: unique
    columns: [project_title, institution, park_name, taxa_or_area_of_study, borough]
  - kind: not_null
    col: project_title
  - kind: not_null
    col: institution
  - kind: not_null
    col: park_name
  - kind: not_null
    col: taxa_or_area_of_study
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 32
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
