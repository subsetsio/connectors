# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-e7es-jx5j`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [phone, dbn, district, grades, accessibility]
checks:
  - kind: unique
    columns: [phone, dbn, district, grades, accessibility]
  - kind: not_null
    col: phone
  - kind: not_null
    col: dbn
  - kind: not_null
    col: district
  - kind: not_null
    col: grades
  - kind: not_null
    col: accessibility
  - kind: row_floor
    min: 395
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
