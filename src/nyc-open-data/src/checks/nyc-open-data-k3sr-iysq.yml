# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-k3sr-iysq`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [system, the_geom, parentid, gispropnum, department]
checks:
  - kind: unique
    columns: [system, the_geom, parentid, gispropnum, department]
  - kind: not_null
    col: system
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: parentid
  - kind: not_null
    col: gispropnum
  - kind: not_null
    col: department
  - kind: row_floor
    min: 20
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
