# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-mrnf-ezdm`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [school_name, principal, dbn, overall_score, closing_the_achievement_gap_points]
checks:
  - kind: unique
    columns: [school_name, principal, dbn, overall_score, closing_the_achievement_gap_points]
  - kind: not_null
    col: school_name
  - kind: not_null
    col: principal
  - kind: not_null
    col: dbn
  - kind: not_null
    col: overall_score
  - kind: not_null
    col: closing_the_achievement_gap_points
  - kind: row_floor
    min: 222
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
