# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-egnf-uyp9`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dbn, hispanic, black, asian, white]
checks:
  - kind: unique
    columns: [dbn, hispanic, black, asian, white]
  - kind: not_null
    col: dbn
  - kind: not_null
    col: hispanic
  - kind: not_null
    col: black
  - kind: not_null
    col: asian
  - kind: not_null
    col: white
  - kind: row_floor
    min: 751
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
