# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-3ups-txji`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [contractid, description, vendorname, date, acronym]
temporal: date
checks:
  - kind: unique
    columns: [contractid, description, vendorname, date, acronym]
  - kind: not_null
    col: contractid
  - kind: not_null
    col: description
  - kind: not_null
    col: vendorname
  - kind: not_null
    col: date
  - kind: not_null
    col: acronym
  - kind: row_floor
    min: 161
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
