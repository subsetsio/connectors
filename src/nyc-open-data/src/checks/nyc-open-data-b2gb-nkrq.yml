# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-b2gb-nkrq`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [updated, cd_number, team_name, cd_name]
temporal: updated
checks:
  - kind: unique
    columns: [updated, cd_number, team_name, cd_name]
  - kind: not_null
    col: updated
  - kind: not_null
    col: cd_number
  - kind: not_null
    col: team_name
  - kind: not_null
    col: cd_name
  - kind: row_floor
    min: 47
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
