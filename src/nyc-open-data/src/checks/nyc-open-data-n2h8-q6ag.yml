# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-n2h8-q6ag`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [the_geom, borough, franchisee, color]
checks:
  - kind: unique
    columns: [the_geom, borough, franchisee, color]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: borough
  - kind: not_null
    col: franchisee
  - kind: not_null
    col: color
  - kind: row_floor
    min: 35
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
