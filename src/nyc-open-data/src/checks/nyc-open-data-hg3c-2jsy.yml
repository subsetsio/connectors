# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-hg3c-2jsy`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [name, opt_code, street_address, school_year, site_type]
checks:
  - kind: unique
    columns: [name, opt_code, street_address, school_year, site_type]
  - kind: not_null
    col: name
  - kind: not_null
    col: opt_code
  - kind: not_null
    col: street_address
  - kind: not_null
    col: school_year
  - kind: not_null
    col: site_type
  - kind: row_floor
    min: 17891
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
