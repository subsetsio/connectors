# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-k2zg-756q`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dbn, trust_score, rigorous_instruction_score, collaborative_teachers_score, effective_school_leadership_score]
checks:
  - kind: unique
    columns: [dbn, trust_score, rigorous_instruction_score, collaborative_teachers_score, effective_school_leadership_score]
  - kind: not_null
    col: dbn
  - kind: not_null
    col: trust_score
  - kind: not_null
    col: rigorous_instruction_score
  - kind: not_null
    col: collaborative_teachers_score
  - kind: not_null
    col: effective_school_leadership_score
  - kind: row_floor
    min: 914
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
