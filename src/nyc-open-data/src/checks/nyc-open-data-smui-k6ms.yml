# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-smui-k6ms`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [admin, race, ethncity_or_national_origin_or_both, sexual_orientation, weight]
checks:
  - kind: unique
    columns: [admin, race, ethncity_or_national_origin_or_both, sexual_orientation, weight]
  - kind: not_null
    col: admin
  - kind: not_null
    col: race
  - kind: not_null
    col: ethncity_or_national_origin_or_both
  - kind: not_null
    col: sexual_orientation
  - kind: not_null
    col: weight
  - kind: row_floor
    min: 17
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
