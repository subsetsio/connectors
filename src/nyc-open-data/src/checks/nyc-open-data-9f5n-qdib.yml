# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-9f5n-qdib`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [evaluation_id, workscope, evaluation_date, provider, nta]
temporal: data_as_of_date
checks:
  - kind: unique
    columns: [evaluation_id, workscope, evaluation_date, provider, nta]
  - kind: not_null
    col: evaluation_id
  - kind: not_null
    col: workscope
  - kind: not_null
    col: evaluation_date
  - kind: not_null
    col: provider
  - kind: not_null
    col: nta
  - kind: row_floor
    min: 24022
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
