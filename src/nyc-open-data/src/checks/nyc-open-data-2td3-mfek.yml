# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-2td3-mfek`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [program_name, zip_code, city, program_type]
checks:
  - kind: unique
    columns: [program_name, zip_code, city, program_type]
  - kind: not_null
    col: program_name
  - kind: not_null
    col: zip_code
  - kind: not_null
    col: city
  - kind: not_null
    col: program_type
  - kind: row_floor
    min: 230
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
