# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-wshr-5vic`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [siteaddress, point, ntaname, dsnydistrict, sitename]
checks:
  - kind: unique
    columns: [siteaddress, point, ntaname, dsnydistrict, sitename]
  - kind: not_null
    col: siteaddress
  - kind: not_null
    col: point
  - kind: not_null
    col: ntaname
  - kind: not_null
    col: dsnydistrict
  - kind: not_null
    col: sitename
  - kind: row_floor
    min: 52
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
