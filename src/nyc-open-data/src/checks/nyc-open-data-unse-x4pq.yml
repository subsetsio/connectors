# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-unse-x4pq`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [total, hispaniclatinx, white, multiracial, unknown]
checks:
  - kind: unique
    columns: [total, hispaniclatinx, white, multiracial, unknown]
  - kind: not_null
    col: total
  - kind: not_null
    col: hispaniclatinx
  - kind: not_null
    col: white
  - kind: not_null
    col: multiracial
  - kind: not_null
    col: unknown
  - kind: row_floor
    min: 80
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
