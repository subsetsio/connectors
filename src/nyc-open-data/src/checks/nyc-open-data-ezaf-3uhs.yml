# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-ezaf-3uhs`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [school_name, dbn, subject, program_type, department]
checks:
  - kind: unique
    columns: [school_name, dbn, subject, program_type, department]
  - kind: not_null
    col: school_name
  - kind: not_null
    col: dbn
  - kind: not_null
    col: subject
  - kind: not_null
    col: program_type
  - kind: not_null
    col: department
  - kind: row_floor
    min: 9397
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
