    columns: [fiscal_year, shelter_type, borough]
  - kind: not_null
    col: fiscal_year
  - kind: not_null
    col: shelter_type
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 140
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
