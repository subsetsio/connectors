# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-tvfr-dhen`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [square_feet, location_name, bldg_id, room_number, bldg_name]
checks:
  - kind: unique
    columns: [square_feet, location_name, bldg_id, room_number, bldg_name]
  - kind: not_null
    col: square_feet
  - kind: not_null
    col: location_name
  - kind: not_null
    col: bldg_id
  - kind: not_null
    col: room_number
  - kind: not_null
    col: bldg_name
  - kind: row_floor
    min: 3579
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
