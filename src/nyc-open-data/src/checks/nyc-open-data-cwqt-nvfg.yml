# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-cwqt-nvfg`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [school, bld_id, district, program_category, boro]
checks:
  - kind: unique
    columns: [school, bld_id, district, program_category, boro]
  - kind: not_null
    col: school
  - kind: not_null
    col: bld_id
  - kind: not_null
    col: district
  - kind: not_null
    col: program_category
  - kind: not_null
    col: boro
  - kind: row_floor
    min: 28
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
