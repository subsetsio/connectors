# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-vtjm-ngnu`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [the_geom, segmentid, school_nam, on_street, from_stree]
temporal: open_date
checks:
  - kind: unique
    columns: [the_geom, segmentid, school_nam, on_street, from_stree]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: segmentid
  - kind: not_null
    col: school_nam
  - kind: not_null
    col: on_street
  - kind: not_null
    col: from_stree
  - kind: row_floor
    min: 110
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
