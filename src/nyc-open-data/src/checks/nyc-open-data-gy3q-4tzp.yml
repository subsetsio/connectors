# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-gy3q-4tzp`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [permit_number, dcid, program_name, street_address, children_allowed_in_care]
checks:
  - kind: unique
    columns: [permit_number, dcid, program_name, street_address, children_allowed_in_care]
  - kind: not_null
    col: permit_number
  - kind: not_null
    col: dcid
  - kind: not_null
    col: program_name
  - kind: not_null
    col: street_address
  - kind: not_null
    col: children_allowed_in_care
  - kind: row_floor
    min: 1366
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
