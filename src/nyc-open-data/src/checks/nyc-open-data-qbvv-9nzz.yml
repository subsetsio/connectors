key: [fiscal_year, revenue_class, revenue_category, publication_date]
checks:
  - kind: unique
    columns: [fiscal_year, revenue_class, revenue_category, publication_date]
  - kind: not_null
    col: fiscal_year
  - kind: not_null
    col: revenue_class
  - kind: not_null
    col: revenue_category
  - kind: not_null
    col: publication_date
  - kind: row_floor
    min: 334
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
