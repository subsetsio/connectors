# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-wq7q-htne`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [source_full, source_label, category_label, category_full, source_units]
checks:
  - kind: unique
    columns: [source_full, source_label, category_label, category_full, source_units]
  - kind: not_null
    col: source_full
  - kind: not_null
    col: source_label
  - kind: not_null
    col: category_label
  - kind: not_null
    col: category_full
  - kind: not_null
    col: source_units
  - kind: row_floor
    min: 42
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
