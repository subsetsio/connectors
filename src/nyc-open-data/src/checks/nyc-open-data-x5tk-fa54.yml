# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-x5tk-fa54`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [agency_number, agency_name, line_number_description, line_number, publication_date]
checks:
  - kind: unique
    columns: [agency_number, agency_name, line_number_description, line_number, publication_date]
  - kind: not_null
    col: agency_number
  - kind: not_null
    col: agency_name
  - kind: not_null
    col: line_number_description
  - kind: not_null
    col: line_number
  - kind: not_null
    col: publication_date
  - kind: row_floor
    min: 11998
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
