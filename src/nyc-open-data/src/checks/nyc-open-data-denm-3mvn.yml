# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-denm-3mvn`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [number_youth, agencyoutcome, period, variable_type]
temporal: period
checks:
  - kind: unique
    columns: [number_youth, agencyoutcome, period, variable_type]
  - kind: not_null
    col: number_youth
  - kind: not_null
    col: agencyoutcome
  - kind: not_null
    col: period
  - kind: not_null
    col: variable_type
  - kind: row_floor
    min: 62
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
