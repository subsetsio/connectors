# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-dcjb-es8v`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [agency_code, agency_name, fiscal_year, funding]
checks:
  - kind: unique
    columns: [agency_code, agency_name, fiscal_year, funding]
  - kind: not_null
    col: agency_code
  - kind: not_null
    col: agency_name
  - kind: not_null
    col: fiscal_year
  - kind: not_null
    col: funding
  - kind: row_floor
    min: 155
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
