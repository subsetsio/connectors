# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-wwcv-s7e7`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [zoning_map, the_geom, section, quartersec]
checks:
  - kind: unique
    columns: [zoning_map, the_geom, section, quartersec]
  - kind: not_null
    col: zoning_map
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: section
  - kind: not_null
    col: quartersec
  - kind: row_floor
    min: 65
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
