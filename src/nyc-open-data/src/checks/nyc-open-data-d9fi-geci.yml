# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-d9fi-geci`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dbn, admissions_methods, fully_screened]
checks:
  - kind: unique
    columns: [dbn, admissions_methods, fully_screened]
  - kind: not_null
    col: dbn
  - kind: not_null
    col: admissions_methods
  - kind: not_null
    col: fully_screened
  - kind: row_floor
    min: 766
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
