# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-vxxs-iyt2`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [location, dbn, total_sw_gc, total_sw, location_type]
checks:
  - kind: unique
    columns: [location, dbn, total_sw_gc, total_sw, location_type]
  - kind: not_null
    col: location
  - kind: not_null
    col: dbn
  - kind: not_null
    col: total_sw_gc
  - kind: not_null
    col: total_sw
  - kind: not_null
    col: location_type
  - kind: row_floor
    min: 822
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
