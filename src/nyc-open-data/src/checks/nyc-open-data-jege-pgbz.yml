# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-jege-pgbz`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [number_of_residents_enrolled_in_courses_or_otherwise_received_guidance, year, borough]
checks:
  - kind: unique
    columns: [number_of_residents_enrolled_in_courses_or_otherwise_received_guidance, year, borough]
  - kind: not_null
    col: number_of_residents_enrolled_in_courses_or_otherwise_received_guidance
  - kind: not_null
    col: year
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 24
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
