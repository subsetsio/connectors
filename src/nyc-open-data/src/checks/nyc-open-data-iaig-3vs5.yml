# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-iaig-3vs5`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [site_id, address, geocode_ad, on_street, borough]
temporal: installati
checks:
  - kind: unique
    columns: [site_id, address, geocode_ad, on_street, borough]
  - kind: not_null
    col: site_id
  - kind: not_null
    col: address
  - kind: not_null
    col: geocode_ad
  - kind: not_null
    col: on_street
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 37
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
