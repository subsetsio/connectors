# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-reri-chf8`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [black, math_level_2, ela_level_1_1, hispanic_1, ela_level_1]
checks:
  - kind: unique
    columns: [black, math_level_2, ela_level_1_1, hispanic_1, ela_level_1]
  - kind: not_null
    col: black
  - kind: not_null
    col: math_level_2
  - kind: not_null
    col: ela_level_1_1
  - kind: not_null
    col: hispanic_1
  - kind: not_null
    col: ela_level_1
  - kind: row_floor
    min: 96
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
