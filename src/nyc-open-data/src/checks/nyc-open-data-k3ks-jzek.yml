# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-k3ks-jzek`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [material, material_group, dsny_diversion_summary_category, location]
checks:
  - kind: unique
    columns: [material, material_group, dsny_diversion_summary_category, location]
  - kind: not_null
    col: material
  - kind: not_null
    col: material_group
  - kind: not_null
    col: dsny_diversion_summary_category
  - kind: not_null
    col: location
  - kind: row_floor
    min: 280
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
