# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-2mby-ccnw`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [ccrb_received_date, complaint_id, close_date, ccrb_complaint_disposition]
temporal: ccrb_received_date
checks:
  - kind: unique
    columns: [ccrb_received_date, complaint_id, close_date, ccrb_complaint_disposition]
  - kind: not_null
    col: ccrb_received_date
  - kind: not_null
    col: complaint_id
  - kind: not_null
    col: close_date
  - kind: not_null
    col: ccrb_complaint_disposition
  - kind: row_floor
    min: 70505
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
