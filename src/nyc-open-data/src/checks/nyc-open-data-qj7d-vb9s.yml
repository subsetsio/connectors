# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-qj7d-vb9s`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [the_geom, cartodb_id, area_name, comm_orgs]
checks:
  - kind: unique
    columns: [the_geom, cartodb_id, area_name, comm_orgs]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: cartodb_id
  - kind: not_null
    col: area_name
  - kind: not_null
    col: comm_orgs
  - kind: row_floor
    min: 6
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
