# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-pmsy-ewrc`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [appointment_date, profile_id, command, rank]
temporal: appointment_date
checks:
  - kind: unique
    columns: [appointment_date, profile_id, command, rank]
  - kind: not_null
    col: appointment_date
  - kind: not_null
    col: profile_id
  - kind: not_null
    col: command
  - kind: not_null
    col: rank
  - kind: row_floor
    min: 17017
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
