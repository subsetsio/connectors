# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-b7j8-z8a7`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [the_geom, source_id, feature_code, sub_code, status]
checks:
  - kind: unique
    columns: [the_geom, source_id, feature_code, sub_code, status]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: source_id
  - kind: not_null
    col: feature_code
  - kind: not_null
    col: sub_code
  - kind: not_null
    col: status
  - kind: row_floor
    min: 7184
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
