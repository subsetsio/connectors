# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-jsrs-ggnx`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [geometry, enumber, ceqr_num, ulurp_num]
checks:
  - kind: unique
    columns: [geometry, enumber, ceqr_num, ulurp_num]
  - kind: not_null
    col: geometry
  - kind: not_null
    col: enumber
  - kind: not_null
    col: ceqr_num
  - kind: not_null
    col: ulurp_num
  - kind: row_floor
    min: 5725
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
