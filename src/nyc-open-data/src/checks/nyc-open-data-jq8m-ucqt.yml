# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [system_code, total_removalssuspensions, removal, principal, superintendent]
checks:
  - kind: unique
    columns: [system_code, total_removalssuspensions, removal, principal, superintendent]
  - kind: not_null
    col: system_code
  - kind: not_null
    col: total_removalssuspensions
  - kind: not_null
    col: removal
  - kind: not_null
    col: principal
  - kind: not_null
    col: superintendent
  - kind: row_floor
    min: 804
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
