# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-r3dx-pew9`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [neighborhoods, goalrank, cd, goal, goalname]
checks:
  - kind: unique
    columns: [neighborhoods, goalrank, cd, goal, goalname]
  - kind: not_null
    col: neighborhoods
  - kind: not_null
    col: goalrank
  - kind: not_null
    col: cd
  - kind: not_null
    col: goal
  - kind: not_null
    col: goalname
  - kind: row_floor
    min: 192
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
