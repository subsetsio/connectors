    columns: [agency, budget_size]
  - kind: not_null
    col: agency
  - kind: not_null
    col: budget_size
  - kind: row_floor
    min: 87
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
