# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-qx6a-vcwx`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [demographic_category, unstable_1, stable, unstable, stable_1]
checks:
  - kind: unique
    columns: [demographic_category, unstable_1, stable, unstable, stable_1]
  - kind: not_null
    col: demographic_category
  - kind: not_null
    col: unstable_1
  - kind: not_null
    col: stable
  - kind: not_null
    col: unstable
  - kind: not_null
    col: stable_1
  - kind: row_floor
    min: 25
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
