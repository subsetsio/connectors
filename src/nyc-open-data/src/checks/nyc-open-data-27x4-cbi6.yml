# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-27x4-cbi6`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [underlying_cause, year, raceethnicity, borough, related]
checks:
  - kind: unique
    columns: [underlying_cause, year, raceethnicity, borough, related]
  - kind: not_null
    col: underlying_cause
  - kind: not_null
    col: year
  - kind: not_null
    col: raceethnicity
  - kind: not_null
    col: borough
  - kind: not_null
    col: related
  - kind: row_floor
    min: 118
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
