# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-urzf-q2g5`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [phone_number, dbn, gradespan, school_type]
checks:
  - kind: unique
    columns: [phone_number, dbn, gradespan, school_type]
  - kind: not_null
    col: phone_number
  - kind: not_null
    col: dbn
  - kind: not_null
    col: gradespan
  - kind: not_null
    col: school_type
  - kind: row_floor
    min: 481
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
