# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-kiyv-ks3f`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [locname, sems_code, address, loccode, phone]
checks:
  - kind: unique
    columns: [locname, sems_code, address, loccode, phone]
  - kind: not_null
    col: locname
  - kind: not_null
    col: sems_code
  - kind: not_null
    col: address
  - kind: not_null
    col: loccode
  - kind: not_null
    col: phone
  - kind: row_floor
    min: 942
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
