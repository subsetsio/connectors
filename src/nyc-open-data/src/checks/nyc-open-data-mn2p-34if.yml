# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-mn2p-34if`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [estimated_fuel_costs_per_gallon, model, fuel_costs_per_mile, year, make]
checks:
  - kind: unique
    columns: [estimated_fuel_costs_per_gallon, model, fuel_costs_per_mile, year, make]
  - kind: not_null
    col: estimated_fuel_costs_per_gallon
  - kind: not_null
    col: model
  - kind: not_null
    col: fuel_costs_per_mile
  - kind: not_null
    col: year
  - kind: not_null
    col: make
  - kind: row_floor
    min: 53
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
