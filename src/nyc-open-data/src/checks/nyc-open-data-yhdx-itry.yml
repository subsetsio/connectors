    columns: [the_geom, vms, main_roadway, direction, hrcevac]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: vms
  - kind: not_null
    col: main_roadway
  - kind: not_null
    col: direction
  - kind: not_null
    col: hrcevac
  - kind: row_floor
