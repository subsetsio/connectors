# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-fm4z-qud6`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [the_geom, asset_id, project_na, dep_contra, outfall]
temporal: constructe
checks:
  - kind: unique
    columns: [the_geom, asset_id, project_na, dep_contra, outfall]
  - kind: not_null
    col: the_geom
  - kind: not_null
    col: asset_id
  - kind: not_null
    col: project_na
  - kind: not_null
    col: dep_contra
  - kind: not_null
    col: outfall
  - kind: row_floor
    min: 98
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
