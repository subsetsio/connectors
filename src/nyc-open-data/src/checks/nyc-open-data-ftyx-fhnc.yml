# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-ftyx-fhnc`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [were_accepted_and_enrolled, were_placed_into_fulltime_or_parttime_jobs, average_wage_of_such_residents, year, borough]
checks:
  - kind: unique
    columns: [were_accepted_and_enrolled, were_placed_into_fulltime_or_parttime_jobs, average_wage_of_such_residents, year, borough]
  - kind: not_null
    col: were_accepted_and_enrolled
  - kind: not_null
    col: were_placed_into_fulltime_or_parttime_jobs
  - kind: not_null
    col: average_wage_of_such_residents
  - kind: not_null
    col: year
  - kind: not_null
    col: borough
  - kind: row_floor
    min: 26
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
