# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-2jrp-puwz`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [unit_of_appropriation, agency_name, agency_code, agency, reporting_fiscal_year]
checks:
  - kind: unique
    columns: [unit_of_appropriation, agency_name, agency_code, agency, reporting_fiscal_year]
  - kind: not_null
    col: unit_of_appropriation
  - kind: not_null
    col: agency_name
  - kind: not_null
    col: agency_code
  - kind: not_null
    col: agency
  - kind: not_null
    col: reporting_fiscal_year
  - kind: row_floor
    min: 1485
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
