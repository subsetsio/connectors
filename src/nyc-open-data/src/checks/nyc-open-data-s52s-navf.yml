# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-s52s-navf`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [description, agency, status, request_type]
checks:
  - kind: unique
    columns: [description, agency, status, request_type]
  - kind: not_null
    col: description
  - kind: not_null
    col: agency
  - kind: not_null
    col: status
  - kind: not_null
    col: request_type
  - kind: row_floor
    min: 10
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
