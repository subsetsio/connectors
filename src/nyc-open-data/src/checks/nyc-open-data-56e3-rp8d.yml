# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-56e3-rp8d`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [license_number, address, phone, city, state]
temporal: date
checks:
  - kind: unique
    columns: [license_number, address, phone, city, state]
  - kind: not_null
    col: license_number
  - kind: not_null
    col: address
  - kind: not_null
    col: phone
  - kind: not_null
    col: city
  - kind: not_null
    col: state
  - kind: row_floor
    min: 6
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
