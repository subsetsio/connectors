# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-qw7r-btyb`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [female, data_period, female_of_foster_population, category, report_update_frequency]
checks:
  - kind: unique
    columns: [female, data_period, female_of_foster_population, category, report_update_frequency]
  - kind: not_null
    col: female
  - kind: not_null
    col: data_period
  - kind: not_null
    col: female_of_foster_population
  - kind: not_null
    col: category
  - kind: not_null
    col: report_update_frequency
  - kind: row_floor
    min: 104
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
