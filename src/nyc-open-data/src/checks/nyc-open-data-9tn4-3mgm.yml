# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-9tn4-3mgm`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [agency_name, agency_acronym, fiscal_year]
checks:
  - kind: unique
    columns: [agency_name, agency_acronym, fiscal_year]
  - kind: not_null
    col: agency_name
  - kind: not_null
    col: agency_acronym
  - kind: not_null
    col: fiscal_year
  - kind: row_floor
    min: 71
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
