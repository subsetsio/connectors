# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-xijd-ubiu`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dbn, total_safety_and_respect_score, total_communication_score, total_engagement_score, total_academic_expectations_score]
checks:
  - kind: unique
    columns: [dbn, total_safety_and_respect_score, total_communication_score, total_engagement_score, total_academic_expectations_score]
  - kind: not_null
    col: dbn
  - kind: not_null
    col: total_safety_and_respect_score
  - kind: not_null
    col: total_communication_score
  - kind: not_null
    col: total_engagement_score
  - kind: not_null
    col: total_academic_expectations_score
  - kind: row_floor
    min: 834
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
