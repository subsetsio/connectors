# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-hb7y-b986`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [date, indicator_number, indicator_name, grouping_1]
temporal: date
checks:
  - kind: unique
    columns: [date, indicator_number, indicator_name, grouping_1]
  - kind: not_null
    col: date
  - kind: not_null
    col: indicator_number
  - kind: not_null
    col: indicator_name
  - kind: not_null
    col: grouping_1
  - kind: row_floor
    min: 2952
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
