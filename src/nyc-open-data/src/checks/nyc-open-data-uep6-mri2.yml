# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-uep6-mri2`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [ela_l3l4_1, math_l3l4, math_level_4, white, ela_level_4]
checks:
  - kind: unique
    columns: [ela_l3l4_1, math_l3l4, math_level_4, white, ela_level_4]
  - kind: not_null
    col: ela_l3l4_1
  - kind: not_null
    col: math_l3l4
  - kind: not_null
    col: math_level_4
  - kind: not_null
    col: white
  - kind: not_null
    col: ela_level_4
  - kind: row_floor
    min: 96
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
