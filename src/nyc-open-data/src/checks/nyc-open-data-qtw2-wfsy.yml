# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-qtw2-wfsy`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dbn, sy1718_total_removalssuspensions, hispanic_principal, black_principal, black_removals]
checks:
  - kind: unique
    columns: [dbn, sy1718_total_removalssuspensions, hispanic_principal, black_principal, black_removals]
  - kind: not_null
    col: dbn
  - kind: not_null
    col: sy1718_total_removalssuspensions
  - kind: not_null
    col: hispanic_principal
  - kind: not_null
    col: black_principal
  - kind: not_null
    col: black_removals
  - kind: row_floor
    min: 830
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
