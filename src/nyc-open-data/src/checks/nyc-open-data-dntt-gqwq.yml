# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-dntt-gqwq`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [inspection_id, damage_id, damage_type_code]
temporal: inspection_date
checks:
  - kind: unique
    columns: [inspection_id, damage_id, damage_type_code]
  - kind: not_null
    col: inspection_id
  - kind: not_null
    col: damage_id
  - kind: not_null
    col: damage_type_code
  - kind: row_floor
    min: 200404
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
