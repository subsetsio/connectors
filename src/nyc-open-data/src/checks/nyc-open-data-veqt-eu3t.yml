# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-veqt-eu3t`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [hmp_index, managing_agency, action_status]
temporal: action_status_date
checks:
  - kind: unique
    columns: [hmp_index, managing_agency, action_status]
  - kind: not_null
    col: hmp_index
  - kind: not_null
    col: managing_agency
  - kind: not_null
    col: action_status
  - kind: row_floor
    min: 494
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
