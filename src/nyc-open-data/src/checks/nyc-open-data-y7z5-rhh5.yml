# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-y7z5-rhh5`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [facility_name, provider_agency, performance_tier, year_quarter]
checks:
  - kind: unique
    columns: [facility_name, provider_agency, performance_tier, year_quarter]
  - kind: not_null
    col: facility_name
  - kind: not_null
    col: provider_agency
  - kind: not_null
    col: performance_tier
  - kind: not_null
    col: year_quarter
  - kind: row_floor
    min: 69
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
