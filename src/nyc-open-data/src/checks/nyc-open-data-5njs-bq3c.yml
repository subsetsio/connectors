# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-5njs-bq3c`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [travel_date, day_id, hh_id, person_id, day_num]
temporal: travel_date
checks:
  - kind: unique
    columns: [travel_date, day_id, hh_id, person_id, day_num]
  - kind: not_null
    col: travel_date
  - kind: not_null
    col: day_id
  - kind: not_null
    col: hh_id
  - kind: not_null
    col: person_id
  - kind: not_null
    col: day_num
  - kind: row_floor
    min: 7963
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
