# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-ydbx-4ufw`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [school_name, dbn, language, school_type, program]
checks:
  - kind: unique
    columns: [school_name, dbn, language, school_type, program]
  - kind: not_null
    col: school_name
  - kind: not_null
    col: dbn
  - kind: not_null
    col: language
  - kind: not_null
    col: school_type
  - kind: not_null
    col: program
  - kind: row_floor
    min: 254
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
