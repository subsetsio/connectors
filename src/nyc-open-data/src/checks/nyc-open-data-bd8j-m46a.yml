# compiled by `hardened compile-checks` — post-publish audit of `nyc-open-data-bd8j-m46a`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [fiscal_year, line_number, schedule, schedule_name, section_number]
checks:
  - kind: unique
    columns: [fiscal_year, line_number, schedule, schedule_name, section_number]
  - kind: not_null
    col: fiscal_year
  - kind: not_null
    col: line_number
  - kind: not_null
    col: schedule
  - kind: not_null
    col: schedule_name
  - kind: not_null
    col: section_number
  - kind: row_floor
    min: 124
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
