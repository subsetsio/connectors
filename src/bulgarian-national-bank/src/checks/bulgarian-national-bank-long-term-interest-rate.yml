# compiled by `hardened compile-checks` — post-publish audit of `bulgarian-national-bank-long-term-interest-rate`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [period, freq, page_id, series_key, series_name]
temporal: period
checks:
  - kind: unique
    columns: [period, freq, page_id, series_key, series_name]
  - kind: not_null
    col: period
  - kind: not_null
    col: freq
  - kind: not_null
    col: page_id
  - kind: not_null
    col: series_key
  - kind: not_null
    col: series_name
  - kind: row_floor
    min: 3087
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
