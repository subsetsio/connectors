# compiled by `hardened compile-checks` — post-publish audit of `fema-emergencymanagementperformancegrants`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [id]
temporal: projectenddate
checks:
  - kind: unique
    columns: [id]
  - kind: not_null
    col: id
  - kind: row_floor
    min: 12985
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  # FEMA has published impossible future project end dates (for example years
  # 3018 and 2108), so max(projectenddate) is an upstream data-quality outlier
  # rather than a usable freshness/regression signal.
  temporal_monotonic: false
