# compiled by `hardened compile-checks` — post-publish audit of `central-statistics-office-svs274`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dim1_label, dim1_code, statistic_code, statistic_label]
temporal: period_start
checks:
  - kind: unique
    columns: [dim1_label, dim1_code, statistic_code, statistic_label]
  - kind: not_null
    col: dim1_label
  - kind: not_null
    col: dim1_code
  - kind: not_null
    col: statistic_code
  - kind: not_null
    col: statistic_label
  - kind: row_floor
    min: 14
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
