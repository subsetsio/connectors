# compiled by `hardened compile-checks` — post-publish audit of `central-statistics-office-sap2016t6t2prov`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [dim2_code, dim2_label, dim1_code, dim1_label, statistic_code]
temporal: period_start
checks:
  - kind: unique
    columns: [dim2_code, dim2_label, dim1_code, dim1_label, statistic_code]
  - kind: not_null
    col: dim2_code
  - kind: not_null
    col: dim2_label
  - kind: not_null
    col: dim1_code
  - kind: not_null
    col: dim1_label
  - kind: not_null
    col: statistic_code
  - kind: row_floor
    min: 44
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
