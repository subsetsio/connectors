# compiled by `hardened compile-checks` — post-publish audit of `central-statistics-office-cepha29`.
# Grain/temporal from the transform contract, row floor from the measured
# profile. Regenerate after model-verify or a transform contract change.
# Not compiled (deliberate): enums (await an authored closed domain),
# absolute freshness (awaits the maintenance contract).
key: [period_start, time_code, time_label, period_end, dim1_code]
temporal: period_start
checks:
  - kind: unique
    columns: [period_start, time_code, time_label, period_end, dim1_code]
  - kind: not_null
    col: period_start
  - kind: not_null
    col: time_code
  - kind: not_null
    col: time_label
  - kind: not_null
    col: period_end
  - kind: not_null
    col: dim1_code
  - kind: row_floor
    min: 71
regression:
  row_shrink_tolerance: 0.1
  key_shrink_tolerance: 0.1
  temporal_monotonic: true
