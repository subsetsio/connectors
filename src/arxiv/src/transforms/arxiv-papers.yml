# arxiv-papers — full arXiv metadata corpus from the weekly Kaggle snapshot.
# 2026-07 (problem 085): re-sourced from the frozen 2020-08 GCS mirror to the
# weekly-refreshed Kaggle dataset. Schema changes, backward-compatible:
#   - created_date: now the real v1 submission date (day granularity; was
#     month-granular YYYY-MM-01 derived from the arXiv id — that derivation
#     survives only as a fallback for records without version metadata)
#   - new columns: update_date (last metadata-update date per the snapshot),
#     license (arXiv license URL, null for most pre-2008 submissions)
key: [arxiv_id]
temporal: created_date
sort: [created_date, arxiv_id]
write_mode: overwrite
columns:
  - name: arxiv_id
    type: VARCHAR
  - name: title
    type: VARCHAR
  - name: abstract
    type: VARCHAR
  - name: authors
    type: VARCHAR
  - name: submitter
    type: VARCHAR
  - name: primary_category
    type: VARCHAR
  - name: categories
    type: VARCHAR
  - name: doi
    type: VARCHAR
  - name: journal_ref
    type: VARCHAR
  - name: report_no
    type: VARCHAR
  - name: comments
    type: VARCHAR
  - name: license
    type: VARCHAR
  - name: num_versions
    type: INTEGER
  - name: created_date
    type: DATE
  - name: update_date
    type: DATE
